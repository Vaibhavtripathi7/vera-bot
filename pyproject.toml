[project]
name = "vera-bot"
version = "0.1.0"
description = "Vera merchant-engagement bot for the magicpin AI Challenge"
authors = [
    { name = "Vaibhavtripathi7", email = "vaibhavtripathi2020@outlook.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "uvicorn[standard]>=0.54.0",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
