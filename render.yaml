# Render Blueprint - free web service (no credit card). Deploy: Render dashboard -> New -> Blueprint -> pick this repo.
services:
  - type: web
    name: vera-bot
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn vera.api:app --host 0.0.0.0 --port $PORT --workers 1 --timeout-keep-alive 30
    healthCheckPath: /v1/healthz
    autoDeploy: false
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: VERA_DB_PATH
        value: /tmp/vera_state.db
      - key: VERA_SESSION_IDLE_RESET
        value: "2700"
      - key: LLM_ENABLED
        value: "1"
      - key: GEMINI_API_KEY
        sync: false            # set the value in the dashboard (secret)
      - key: GEMINI_WRITER_MODELS
        value: gemini-3.5-flash-lite,gemini-flash-lite-latest,gemini-3.5-flash,gemini-3.8-flash
      - key: GEMINI_CRITIC_MODELS
        value: gemini-flash-lite-latest,gemini-3.5-flash-lite
      - key: GEMINI_LIMITS
        value: gemini-3.5-flash:4:18,gemini-3.6-flash:4:18,gemini-3.7-flash:4:18,gemini-3.8-flash:4:18,gemini-3.5-flash-lite:12:450,gemini-flash-lite-latest:12:450
      - key: TEAM_NAME
        value: Vaibhav Tripathi
      - key: TEAM_MEMBERS
        value: Vaibhav Tripathi
      - key: CONTACT_EMAIL
        sync: false
